[package]
name = "skinnable-tauri-demo-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlInputElement", "XPathResult"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
gloo-utils = "0.2.0"
gloo-events = "0.2.0"
log = "0.4.29"
wasm-logger = "0.2.0"
css-asset-pack = { version = "0.1.0", path = ".." }

[workspace]
members = ["src-tauri"]
